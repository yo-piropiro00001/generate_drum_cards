<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drum Trump Card Generator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Noto+Sans+JP:wght@800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* =========================================
       基本スタイル & UI
       ========================================= */
    :root {
      --type-color: #4cd964;
      --type-color-dark: #248a3d;
      --card-width: 330px;
      --card-height: 462px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #07070a;
      color: #e0e6ed;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      margin: 0 0 20px 0;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffd700 0%, #ffffff 50%, #b38728 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .preview-wrapper {
      perspective: 1000px;
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
      width: 100%;
    }

    /* =========================================
       カード本体ベース
       ========================================= */
    .tcg-card {
      width: var(--card-width);
      height: var(--card-height);
      border-radius: 18px;
      position: relative;
      flex-shrink: 0;
      background: #12131a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      overflow: hidden;
      user-select: none;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
    }

    .full-art-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      display: none;
    }

    .card-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 3;
    }

    /* --- トランプインデックス (サイズ拡大・調整) --- */
    .trump-index {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.9;
      z-index: 6;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      pointer-events: none;
    }
    .index-top-left {
      top: 8px;
      left: 8px;
    }
    .index-bottom-right {
      bottom: 8px;
      right: 8px;
      transform: rotate(180deg);
    }
    .trump-rank {
      font-size: 21px;
      font-weight: 900;
    }
    .trump-suit {
      font-size: 19px;
      margin-top: 1px;
    }

    /* スート別カラーバリエーション */
    .suit-black { color: #f1f5f9; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    .suit-red { color: #ff4757; text-shadow: 0 0 8px rgba(255, 71, 87, 0.7), 0 2px 4px #000; }
    .suit-joker { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.8), 0 2px 4px #000; }

    /* 属性カラーマッピング */
    .tcg-card[data-type="grass"]    { --type-color: #4CAF50; --type-color-dark: #1b5e20; }
    .tcg-card[data-type="fire"]     { --type-color: #ff5252; --type-color-dark: #b71c1c; }
    .tcg-card[data-type="water"]    { --type-color: #448aff; --type-color-dark: #0d47a1; }
    .tcg-card[data-type="lightning"]{ --type-color: #ffd700; --type-color-dark: #f57f17; }
    .tcg-card[data-type="psychic"]  { --type-color: #e040fb; --type-color-dark: #4a148c; }
    .tcg-card[data-type="fighting"] { --type-color: #ff6e40; --type-color-dark: #bf360c; }
    .tcg-card[data-type="darkness"] { --type-color: #78909c; --type-color-dark: #212121; }
    .tcg-card[data-type="metal"]    { --type-color: #b0bec5; --type-color-dark: #37474f; }
    .tcg-card[data-type="colorless"]{ --type-color: #cfd8dc; --type-color-dark: #455a64; }

    /* --- ヘッダー --- */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      margin-bottom: 8px;
      padding-left: 24px;
    }
    .card-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-stage {
      font-size: 9px;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 2px 6px;
      border-radius: 4px;
      color: #d1d5db;
      text-transform: uppercase;
    }
    .card-name {
      font-size: 19px;
      font-weight: 900;
      color: #fff;
      margin: 0;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }
    .card-hp-group {
      display: flex;
      align-items: baseline;
      gap: 3px;
      color: #ff5252;
      font-family: 'Teko', sans-serif;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }
    .card-hp-label { font-size: 15px; font-weight: 700; font-family: 'Cinzel', serif; }
    .card-hp-val { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
    
    .card-type-icon {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--type-color), var(--type-color-dark));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.6);
      border: 1.5px solid rgba(255,255,255,0.5);
      margin-left: 6px;
    }

    /* --- 通常イラスト枠 --- */
    .card-art-frame {
      width: 100%;
      height: 195px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.5);
      background-color: #0d0e15;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* --- ワザ＆テキストエリア --- */
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 8px;
      z-index: 5;
    }

    .move-block {
      background: rgba(12, 14, 22, 0.9);
      border-radius: 10px;
      padding: 10px 12px;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .move-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .move-cost { display: flex; gap: 4px; }
    .cost-energy {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--type-color), var(--type-color-dark));
      border: 1px solid rgba(255,255,255,0.4);
    }
    .move-name { font-size: 15px; font-weight: 800; flex-grow: 1; margin-left: 8px; }
    .move-desc {
      font-size: 11px; font-weight: 500; margin: 6px 0 0 0; color: #cbd5e1; line-height: 1.4;
    }

    /* --- フッター --- */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      z-index: 5;
      padding: 4px 26px 0 2px;
    }
    .rarity-symbol { font-size: 13px; letter-spacing: 1px; }

    /* =========================================
       デザイン階層 (レアリティ演出)
       ========================================= */

    /* ---------- LV.1 Normal (◇) ---------- */
    .rarity-normal {
      background: linear-gradient(165deg, #2a2d3d 0%, #151722 100%);
      border: 6px solid var(--type-color-dark);
    }
    .rarity-normal .full-art-bg { display: none; }
    .rarity-normal .card-art-frame { display: block; }

    /* ---------- LV.2 AR / Art Rare (☆1) ---------- */
    .rarity-ar {
      border: 3px solid rgba(255, 255, 255, 0.8);
      background: #000;
    }
    .rarity-ar .full-art-bg { display: block; opacity: 0.95; }
    .rarity-ar .card-art-frame { display: none; }
    .rarity-ar .move-block {
      background: rgba(8, 10, 16, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* ---------- LV.3 SR / Super Rare (☆2) ---------- */
    /* 最外端豪華金枠 ＋ 高密度多色キラキラ発光粒子 (宝石埋め込みは削除) */
    .rarity-sr {
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.85), 0 0 20px rgba(0, 240, 255, 0.5);
    }
    .rarity-sr .full-art-bg {
      display: block;
      opacity: 0.95;
      top: 12px;
      left: 12px;
      width: calc(100% - 24px);
      height: calc(100% - 24px);
      border-radius: 10px;
      border: 2px solid #ffe066;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.7);
    }
    .rarity-sr .card-art-frame { display: none; }
    .rarity-sr .card-inner {
      background: transparent;
      padding: 16px 18px;
    }
    .rarity-sr .card-name {
      color: #fff3a8;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.9), 0 2px 4px #000;
    }
    .rarity-sr .card-name::before { content: '✨ '; font-size: 15px; }
    .rarity-sr .card-name::after { content: ' ✨'; font-size: 15px; }
    .rarity-sr .card-hp-group { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.9); }

    /* 高密度＆高カラフル発光粒子のレイヤー */
    .rarity-sr .card-overlay {
      background-image: 
        /* 大粒キラキラ発光オーラ */
        radial-gradient(circle at 15% 15%, rgba(255, 215, 0, 0.8) 0%, transparent 12px),
        radial-gradient(circle at 85% 20%, rgba(0, 240, 255, 0.8) 0%, transparent 12px),
        radial-gradient(circle at 20% 70%, rgba(255, 0, 128, 0.8) 0%, transparent 12px),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.8) 0%, transparent 12px),
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.9) 0%, transparent 14px),
        radial-gradient(circle at 70% 60%, rgba(168, 85, 247, 0.8) 0%, transparent 12px),
        radial-gradient(circle at 35% 85%, rgba(255, 159, 67, 0.8) 0%, transparent 12px),
        /* 高密度多色ジュエル粒子（上層） */
        radial-gradient(2px 2px at 20px 30px, #ffffff, transparent),
        radial-gradient(3px 3px at 50px 80px, #ffd700, transparent),
        radial-gradient(2px 2px at 90px 40px, #00f0ff, transparent),
        radial-gradient(3px 3px at 140px 110px, #ff007f, transparent),
        radial-gradient(2px 2px at 180px 50px, #00ff88, transparent),
        radial-gradient(3px 3px at 220px 90px, #a855f7, transparent),
        radial-gradient(2px 2px at 270px 35px, #ff9f43, transparent),
        radial-gradient(3px 3px at 300px 100px, #ffffff, transparent),
        /* 高密度多色ジュエル粒子（中層） */
        radial-gradient(3px 3px at 35px 170px, #00f0ff, transparent),
        radial-gradient(2px 2px at 75px 220px, #ff007f, transparent),
        radial-gradient(3px 3px at 115px 190px, #ffd700, transparent),
        radial-gradient(2px 2px at 165px 240px, #ffffff, transparent),
        radial-gradient(3px 3px at 205px 200px, #00ff88, transparent),
        radial-gradient(2px 2px at 255px 230px, #a855f7, transparent),
        radial-gradient(3px 3px at 295px 180px, #ff9f43, transparent),
        /* 高密度多色ジュエル粒子（下層） */
        radial-gradient(2px 2px at 25px 300px, #ffd700, transparent),
        radial-gradient(3px 3px at 65px 360px, #ffffff, transparent),
        radial-gradient(2px 2px at 105px 310px, #a855f7, transparent),
        radial-gradient(3px 3px at 155px 370px, #00f0ff, transparent),
        radial-gradient(2px 2px at 195px 330px, #ff007f, transparent),
        radial-gradient(3px 3px at 245px 380px, #00ff88, transparent),
        radial-gradient(2px 2px at 285px 320px, #ff9f43, transparent),
        radial-gradient(3px 3px at 45px 430px, #ff007f, transparent),
        radial-gradient(2px 2px at 125px 440px, #00ff88, transparent),
        radial-gradient(3px 3px at 185px 425px, #ffd700, transparent),
        radial-gradient(2px 2px at 265px 435px, #00f0ff, transparent);
      background-repeat: no-repeat;
      opacity: 0.9;
    }

    .rarity-sr .move-block {
      background: rgba(8, 10, 16, 0.88);
      border: 2px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    /* =========================================
       コントロールパネル (操作UI)
       ========================================= */
    .controls {
      background: #12131c;
      padding: 22px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; }
    .form-row > div { flex: 1; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #8a99ad;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="text"], input[type="number"], select, input[type="file"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #2a2d3d;
      background: #090a10;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #00f0ff;
    }

    .btn-download {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #111;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-download:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Drum Trump Card Generator</h1>

    <!-- カードプレビュー -->
    <div class="preview-wrapper">
      <div id="card" class="tcg-card rarity-normal" data-type="fire">
        
        <!-- 左上トランプインデックス -->
        <div class="trump-index index-top-left suit-black">
          <span class="trump-rank" id="disp-rank-tl">A</span>
          <span class="trump-suit" id="disp-suit-tl">♠</span>
        </div>

        <!-- 右下トランプインデックス -->
        <div class="trump-index index-bottom-right suit-black">
          <span class="trump-rank" id="disp-rank-br">A</span>
          <span class="trump-suit" id="disp-suit-br">♠</span>
        </div>

        <!-- フルアート背景 (AR/SR用) -->
        <div id="disp-full-art" class="full-art-bg"></div>
        <!-- オーバーレイ (高密度・多色発光粒子) -->
        <div class="card-overlay"></div>

        <div class="card-inner">
          <div class="card-header">
            <div class="card-title-group">
              <span class="card-stage" id="disp-stage">たね</span>
              <h2 class="card-name" id="disp-name">ジバニャン</h2>
            </div>
            <div class="card-hp-group">
              <span class="card-hp-label">Lv</span>
              <span class="card-hp-val" id="disp-hp">180</span>
              <div class="card-type-icon" id="disp-type-icon">炎</div>
            </div>
          </div>

          <!-- 通常イラスト枠（Normal用） -->
          <div id="disp-art-frame" class="card-art-frame"></div>

          <div class="card-body">
            <div class="move-block">
              <div class="move-header">
                <div class="move-cost">
                  <div class="cost-energy"></div>
                  <div class="cost-energy"></div>
                </div>
                <span class="move-name" id="disp-move-name">達成項目</span>
              </div>
              <p class="move-desc" id="disp-move-desc">説明文</p>
            </div>
          </div>

          <div class="card-footer">
            <span class="rarity-symbol" id="disp-rarity">◇◇</span>
          </div>
        </div>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div class="controls">
      <!-- トランプ設定 -->
      <div class="form-row">
        <div class="form-group">
          <label for="input-suit">TRUMP SUIT (マーク)</label>
          <select id="input-suit">
            <option value="spade">♠ スペード</option>
            <option value="heart">♥ ハート</option>
            <option value="diamond">♦ ダイヤ</option>
            <option value="club">♣ クラブ</option>
            <option value="joker">🃏 JOKER</option>
          </select>
        </div>
        <div class="form-group">
          <label for="input-rank">RANK (数字)</label>
          <select id="input-rank">
            <option value="A">A (1)</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="J">J</option>
            <option value="Q">Q</option>
            <option value="K">K</option>
            <option value="JK">JOKER</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="input-rarity">RARITY (レアリティ)</label>
        <select id="input-rarity">
          <option value="normal" selected>◇1〜4 Normal (標準)</option>
          <option value="ar">☆1 Art Rare / AR (フルアート)</option>
          <option value="sr">☆2 Super Rare / SR (豪華金枠＆キラキラ高密度ホロ)</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="input-type">ELEMENT (属性)</label>
          <select id="input-type">
            <option value="grass">草 (Grass)</option>
            <option value="fire" selected>炎 (Fire)</option>
            <option value="water">水 (Water)</option>
            <option value="lightning">雷 (Lightning)</option>
            <option value="psychic">超 (Psychic)</option>
            <option value="fighting">闘 (Fighting)</option>
            <option value="darkness">悪 (Darkness)</option>
            <option value="metal">鋼 (Metal)</option>
            <option value="colorless">無色 (Colorless)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="input-stage">STAGE (区分)</label>
          <input type="text" id="input-stage" value="たね">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="input-name">NAME (カード名)</label>
          <input type="text" id="input-name" value="ジバニャン">
        </div>
        <div class="form-group">
          <label for="input-hp">LV (レベル)</label>
          <input type="number" id="input-hp" value="180">
        </div>
      </div>

      <div class="form-group">
        <label for="input-image">ARTWORK (イラスト画像)</label>
        <input type="file" id="input-image" accept="image/*">
      </div>

      <div class="form-group">
        <label for="input-move-name">SKILL NAME (達成項目)</label>
        <input type="text" id="input-move-name" value="達成したこと">
      </div>

      <div class="form-group">
        <label for="input-move-desc">DESCRIPTION (説明文)</label>
        <input type="text" id="input-move-desc" value="説明文">
      </div>

      <button id="btn-download" class="btn-download">EXPORT CARD IMAGE</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('card');
      const artFrame = document.getElementById('disp-art-frame');
      const fullArtBg = document.getElementById('disp-full-art');

      const defaultImg = "data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22330%22%20height%3D%22195%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22330%22%20height%3D%22195%22%20fill%3D%22%2312131c%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-size%3D%2213%22%20text-anchor%3D%22middle%22%20fill%3D%22%23475569%22%20font-family%3D%22sans-serif%22%3E画像を選択してください%3C%2Ftext%3E%3C%2Fsvg%3E";
      artFrame.style.backgroundImage = `url("${defaultImg}")`;
      fullArtBg.style.backgroundImage = `url("${defaultImg}")`;

      // テキストリアルタイム反映
      const bindText = (inputId, dispId) => {
        document.getElementById(inputId).addEventListener('input', (e) => {
          document.getElementById(dispId).textContent = e.target.value;
        });
      };

      bindText('input-stage', 'disp-stage');
      bindText('input-name', 'disp-name');
      bindText('input-hp', 'disp-hp');
      bindText('input-move-name', 'disp-move-name');
      bindText('input-move-desc', 'disp-move-desc');

      // トランプ：スート（マーク）変更処理
      const suitSelect = document.getElementById('input-suit');
      const rankSelect = document.getElementById('input-rank');
      const indexEls = document.querySelectorAll('.trump-index');
      
      const suitMap = {
        spade:   { char: '♠', colorClass: 'suit-black' },
        heart:   { char: '♥', colorClass: 'suit-red' },
        diamond: { char: '♦', colorClass: 'suit-red' },
        club:    { char: '♣', colorClass: 'suit-black' },
        joker:   { char: '🃏', colorClass: 'suit-joker' }
      };

      suitSelect.addEventListener('change', (e) => {
        const data = suitMap[e.target.value];
        indexEls.forEach(el => {
          el.querySelector('.trump-suit').textContent = data.char;
          el.classList.remove('suit-black', 'suit-red', 'suit-joker');
          el.classList.add(data.colorClass);
        });

        // JOKER選択時に自動でRANKもJKに切り替え
        if (e.target.value === 'joker') {
          rankSelect.value = 'JK';
          updateRank('JK');
        }
      });

      // トランプ：ランク（数字）変更処理
      const updateRank = (val) => {
        document.getElementById('disp-rank-tl').textContent = val;
        document.getElementById('disp-rank-br').textContent = val;
      };

      rankSelect.addEventListener('change', (e) => {
        updateRank(e.target.value);
      });

      // 属性変更
      const typeSelect = document.getElementById('input-type');
      const typeIconMap = {
        grass: '草', fire: '炎', water: '水', lightning: '雷',
        psychic: '超', fighting: '闘', darkness: '悪', metal: '鋼', colorless: '無'
      };

      typeSelect.addEventListener('change', (e) => {
        const val = e.target.value;
        card.setAttribute('data-type', val);
        document.getElementById('disp-type-icon').textContent = typeIconMap[val];
      });

      // レアリティ変更
      const raritySelect = document.getElementById('input-rarity');
      const raritySymbolMap = {
        normal: '◇◇',
        ar: '☆',
        sr: '☆☆'
      };

      raritySelect.addEventListener('change', (e) => {
        const val = e.target.value;
        card.classList.remove('rarity-normal', 'rarity-ar', 'rarity-sr');
        card.classList.add(`rarity-${val}`);
        document.getElementById('disp-rarity').textContent = raritySymbolMap[val];
      });

      // 画像アップロード
      document.getElementById('input-image').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const imgData = event.target.result;
            artFrame.style.backgroundImage = `url("${imgData}")`;
            fullArtBg.style.backgroundImage = `url("${imgData}")`;
          };
          reader.readAsDataURL(file);
        }
      });

      // 3Dホバーパースペクティブ
      const wrapper = document.querySelector('.preview-wrapper');
      let isExporting = false;

      wrapper.addEventListener('mousemove', (e) => {
        if (isExporting) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        card.style.transform = `rotateY(${x / 12}deg) rotateX(${-y / 12}deg)`;
      });

      wrapper.addEventListener('mouseleave', () => {
        if (isExporting) return;
        card.style.transform = 'rotateY(0deg) rotateX(0deg)';
      });

      // エクスポート処理
      document.getElementById('btn-download').addEventListener('click', () => {
        const btn = document.getElementById('btn-download');
        btn.disabled = true;
        btn.textContent = 'EXPORTING...';
        isExporting = true;

        card.style.transform = 'none';

        setTimeout(() => {
          html2canvas(card, {
            scale: 3,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            logging: false
          }).then(canvas => {
            const link = document.createElement('a');
            link.download = `tcg-trump-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          }).catch(err => {
            alert('エクスポートに失敗しました。');
            console.error(err);
          }).finally(() => {
            btn.disabled = false;
            btn.textContent = 'EXPORT CARD IMAGE';
            isExporting = false;
          });
        }, 150);
      });
    });
  </script>
</body>
</html>
