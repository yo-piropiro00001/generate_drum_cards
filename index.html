<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TCG Pocket Card Generator - Luxury Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Noto+Sans+JP:wght@800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* =========================================
       基本スタイル & UI
       ========================================= */
    :root {
      --type-color: #4cd964;
      --type-color-dark: #248a3d;
      --card-width: 330px;
      --card-height: 462px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #07070a;
      color: #e0e6ed;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      margin: 0 0 20px 0;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffd700 0%, #ffffff 50%, #b38728 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .preview-wrapper {
      perspective: 1000px;
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
      width: 100%;
    }

    /* =========================================
       カード本体ベース
       ========================================= */
    .tcg-card {
      width: var(--card-width);
      height: var(--card-height);
      border-radius: 18px;
      position: relative;
      flex-shrink: 0;
      background: #12131a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      overflow: hidden;
      user-select: none;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
    }

    .full-art-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      display: none;
    }

    .card-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      padding: 14px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 3;
    }

    /* 属性カラーマッピング */
    .tcg-card[data-type="grass"]    { --type-color: #4CAF50; --type-color-dark: #1b5e20; }
    .tcg-card[data-type="fire"]     { --type-color: #ff5252; --type-color-dark: #b71c1c; }
    .tcg-card[data-type="water"]    { --type-color: #448aff; --type-color-dark: #0d47a1; }
    .tcg-card[data-type="lightning"]{ --type-color: #ffd700; --type-color-dark: #f57f17; }
    .tcg-card[data-type="psychic"]  { --type-color: #e040fb; --type-color-dark: #4a148c; }
    .tcg-card[data-type="fighting"] { --type-color: #ff6e40; --type-color-dark: #bf360c; }
    .tcg-card[data-type="darkness"] { --type-color: #78909c; --type-color-dark: #212121; }
    .tcg-card[data-type="metal"]    { --type-color: #b0bec5; --type-color-dark: #37474f; }
    .tcg-card[data-type="colorless"]{ --type-color: #cfd8dc; --type-color-dark: #455a64; }

    /* --- ヘッダー --- */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      margin-bottom: 8px;
    }
    .card-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-stage {
      font-size: 9px;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 2px 6px;
      border-radius: 4px;
      color: #d1d5db;
      text-transform: uppercase;
    }
    .card-name {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      margin: 0;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }
    .card-hp-group {
      display: flex;
      align-items: baseline;
      gap: 2px;
      color: #ff5252;
      font-family: 'Teko', sans-serif;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }
    .card-hp-label { font-size: 13px; font-weight: 700; }
    .card-hp-val { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
    
    .card-type-icon {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--type-color), var(--type-color-dark));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.6);
      border: 1.5px solid rgba(255,255,255,0.5);
      margin-left: 6px;
    }

    /* --- 通常イラスト枠 --- */
    .card-art-frame {
      width: 100%;
      height: 195px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.5);
      background-color: #0d0e15;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* --- ワザ＆テキストエリア --- */
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 8px;
      z-index: 5;
    }

    .move-block {
      background: rgba(12, 14, 22, 0.9);
      border-radius: 10px;
      padding: 10px 12px;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .move-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .move-cost { display: flex; gap: 4px; }
    .cost-energy {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--type-color), var(--type-color-dark));
      border: 1px solid rgba(255,255,255,0.4);
    }
    .move-name { font-size: 15px; font-weight: 800; flex-grow: 1; margin-left: 8px; }
    .move-damage {
      font-family: 'Teko', sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }
    .move-desc {
      font-size: 11px; font-weight: 500; margin: 6px 0 0 0; color: #cbd5e1; line-height: 1.4;
    }

    /* --- フッター --- */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      z-index: 5;
      padding: 4px 2px 0 2px;
    }
    .rarity-symbol { font-size: 13px; letter-spacing: 1px; }


    /* =========================================
       ★ 豪華デザイン階層 (レアリティ演出) ★
       ========================================= */

    /* ---------- LV.1 Normal (◇) ---------- */
    .rarity-normal {
      background: linear-gradient(165deg, #2a2d3d 0%, #151722 100%);
      border: 6px solid var(--type-color-dark);
    }
    .rarity-normal .full-art-bg { display: none; }
    .rarity-normal .card-art-frame { display: block; }

    /* ---------- LV.2 AR / Art Rare (☆1) ---------- */
    .rarity-ar {
      border: 3px solid rgba(255, 255, 255, 0.8);
      background: #000;
    }
    .rarity-ar .full-art-bg { display: block; opacity: 0.95; }
    .rarity-ar .card-art-frame { display: none; }
    .rarity-ar .move-block {
      background: rgba(8, 10, 16, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* ---------- LV.3 SR / Super Rare (☆2) ---------- */
    .rarity-sr {
      background: linear-gradient(135deg, #f3e5ab 0%, #ffd700 30%, #b38728 70%, #fbf5b7 100%);
      padding: 6px;
    }
    .rarity-sr .full-art-bg { display: none; }
    .rarity-sr .card-art-frame { display: block; border: 2.5px solid #ffd700; }
    .rarity-sr .card-inner {
      background: linear-gradient(160deg, rgba(28, 22, 12, 0.95) 0%, rgba(10, 8, 4, 0.98) 100%);
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.5);
    }
    .rarity-sr .card-name {
      color: #fff3a8;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 2px 4px #000;
    }
    .rarity-sr .card-overlay {
      background: linear-gradient(115deg, transparent 35%, rgba(255, 215, 0, 0.3) 48%, rgba(255, 255, 255, 0.6) 50%, rgba(255, 215, 0, 0.3) 52%, transparent 65%);
    }

    /* ---------- 🌌 LV.4 Immersive / UR (☆3) ---------- */
    .rarity-ur {
      background: linear-gradient(135deg, #ff007f, #00f0ff, #7b2cbf, #ff007f);
      background-size: 200% 200%;
      padding: 6px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.5), 0 0 20px rgba(255, 0, 128, 0.5);
    }
    .rarity-ur .full-art-bg { display: block; opacity: 0.92; }
    .rarity-ur .card-art-frame { display: none; }
    .rarity-ur .card-inner {
      background: linear-gradient(180deg, rgba(5, 7, 15, 0.6) 0%, rgba(15, 5, 25, 0.8) 100%);
      border-radius: 12px;
      border: 1.5px solid rgba(0, 240, 255, 0.8);
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .rarity-ur .card-name {
      color: #00f0ff;
      text-shadow: 0 0 12px #00f0ff, 0 0 20px #00f0ff, 0 2px 4px #000;
    }
    .rarity-ur .card-hp-group {
      color: #ff007f;
      text-shadow: 0 0 12px #ff007f;
    }
    .rarity-ur .move-block {
      background: rgba(6, 10, 22, 0.92);
      border: 1.5px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
    }
    .rarity-ur .move-damage {
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff;
    }
    .rarity-ur .rarity-symbol {
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff;
    }
    .rarity-ur .card-overlay {
      background: radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.25), transparent 70%),
                  linear-gradient(135deg, rgba(255, 0, 128, 0.2) 0%, transparent 100%);
    }

    /* ---------- 👑 LV.5 Crown Rare (最高峰クラウン) ---------- */
    .rarity-crown {
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      padding: 8px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.9);
      border-radius: 18px;
    }
    .rarity-crown .full-art-bg { display: block; opacity: 0.88; }
    .rarity-crown .card-art-frame { display: none; }
    
    /* クラウン専用・豪華ゴールドインナーフレーム */
    .rarity-crown .card-inner {
      background: linear-gradient(165deg, rgba(20, 15, 5, 0.75) 0%, rgba(5, 4, 2, 0.9) 100%);
      border-radius: 10px;
      border: 2px solid #ffe066;
      box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.5), 0 0 10px rgba(0,0,0,0.8);
      position: relative;
    }

    /* 四隅のゴールドエンブレム装飾 (CSS疑似要素) */
    .rarity-crown::before {
      content: '👑';
      position: absolute;
      top: 2px; left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      z-index: 10;
      filter: drop-shadow(0 0 6px #ffd700);
    }

    .rarity-crown .card-name {
      font-size: 22px;
      color: #fffdf0;
      text-shadow: 0 0 12px #ffd700, 0 0 24px #ffd700, 0 2px 5px #000;
    }
    .rarity-crown .card-hp-group {
      color: #ffd700;
      text-shadow: 0 0 12px #ffd700, 0 2px 4px #000;
    }
    .rarity-crown .move-block {
      background: linear-gradient(135deg, rgba(25, 20, 10, 0.95), rgba(8, 6, 3, 0.98));
      border: 2px solid #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }
    .rarity-crown .move-name { color: #fffdf0; }
    .rarity-crown .move-damage {
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
    }
    .rarity-crown .move-desc { color: #fef08a; }
    .rarity-crown .card-footer {
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    }
    .rarity-crown .rarity-symbol {
      font-size: 18px;
      filter: drop-shadow(0 0 8px #ffd700);
    }
    .rarity-crown .card-overlay {
      background: radial-gradient(circle at 50% 20%, rgba(255, 215, 0, 0.35), transparent 70%),
                  linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.4) 50%, transparent 60%);
    }


    /* =========================================
       コントロールパネル (操作UI)
       ========================================= */
    .controls {
      background: #12131c;
      padding: 22px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; }
    .form-row > div { flex: 1; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #8a99ad;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="text"], input[type="number"], select, input[type="file"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #2a2d3d;
      background: #090a10;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #00f0ff;
    }

    .btn-download {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #111;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-download:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>TCG Pocket Generator</h1>

    <!-- カードプレビュー -->
    <div class="preview-wrapper">
      <div id="card" class="tcg-card rarity-crown" data-type="grass">
        <!-- フルアート背景 -->
        <div id="disp-full-art" class="full-art-bg"></div>
        <!-- ホログラフィックオーバーレイ -->
        <div class="card-overlay"></div>

        <div class="card-inner">
          <div class="card-header">
            <div class="card-title-group">
              <span class="card-stage" id="disp-stage">たね</span>
              <h2 class="card-name" id="disp-name">リザードンex</h2>
            </div>
            <div class="card-hp-group">
              <span class="card-hp-label">HP</span>
              <span class="card-hp-val" id="disp-hp">180</span>
              <div class="card-type-icon" id="disp-type-icon">炎</div>
            </div>
          </div>

          <!-- 通常イラスト枠（Normal/SR用） -->
          <div id="disp-art-frame" class="card-art-frame"></div>

          <div class="card-body">
            <div class="move-block">
              <div class="move-header">
                <div class="move-cost">
                  <div class="cost-energy"></div>
                  <div class="cost-energy"></div>
                </div>
                <span class="move-name" id="disp-move-name">ぐれんのあらし</span>
                <span class="move-damage" id="disp-move-damage">200</span>
              </div>
              <p class="move-desc" id="disp-move-desc">このポケモンについているエネルギーを2個トラッシュする。</p>
            </div>
          </div>

          <div class="card-footer">
            <span id="disp-author">Illus. PocketStudio</span>
            <span class="rarity-symbol" id="disp-rarity">👑</span>
          </div>
        </div>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div class="controls">
      <div class="form-group">
        <label for="input-rarity">RARITY (レアリティ)</label>
        <select id="input-rarity">
          <option value="normal">◇1〜4 Normal (標準)</option>
          <option value="ar">☆1 Art Rare / AR (フルアート)</option>
          <option value="sr">☆2 Super Rare / SR (金枠＆ホロ)</option>
          <option value="ur">☆3 Immersive / UR (サイバーオーラ)</option>
          <option value="crown" selected>👑 Crown Rare (最高峰箔押し)</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="input-type">ELEMENT (属性)</label>
          <select id="input-type">
            <option value="grass">草 (Grass)</option>
            <option value="fire" selected>炎 (Fire)</option>
            <option value="water">水 (Water)</option>
            <option value="lightning">雷 (Lightning)</option>
            <option value="psychic">超 (Psychic)</option>
            <option value="fighting">闘 (Fighting)</option>
            <option value="darkness">悪 (Darkness)</option>
            <option value="metal">鋼 (Metal)</option>
            <option value="colorless">無色 (Colorless)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="input-stage">STAGE (区分)</label>
          <input type="text" id="input-stage" value="たね">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="input-name">NAME (カード名)</label>
          <input type="text" id="input-name" value="リザードンex">
        </div>
        <div class="form-group">
          <label for="input-hp">HP</label>
          <input type="number" id="input-hp" value="180">
        </div>
      </div>

      <div class="form-group">
        <label for="input-image">ARTWORK (イラスト画像)</label>
        <input type="file" id="input-image" accept="image/*">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="input-move-name">SKILL NAME (ワザ名)</label>
          <input type="text" id="input-move-name" value="ぐれんのあらし">
        </div>
        <div class="form-group">
          <label for="input-move-damage">DAMAGE</label>
          <input type="text" id="input-move-damage" value="200">
        </div>
      </div>

      <div class="form-group">
        <label for="input-move-desc">DESCRIPTION (説明文)</label>
        <input type="text" id="input-move-desc" value="このポケモンについているエネルギーを2個トラッシュする。">
      </div>

      <div class="form-group">
        <label for="input-author">CREDIT (制作者表記)</label>
        <input type="text" id="input-author" value="Illus. PocketStudio">
      </div>

      <button id="btn-download" class="btn-download">EXPORT CARD IMAGE</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('card');
      const artFrame = document.getElementById('disp-art-frame');
      const fullArtBg = document.getElementById('disp-full-art');

      // 初期属性を「炎」に設定
      card.setAttribute('data-type', 'fire');

      const defaultImg = "data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22330%22%20height%3D%22195%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22330%22%20height%3D%22195%22%20fill%3D%22%2312131c%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-size%3D%2213%22%20text-anchor%3D%22middle%22%20fill%3D%22%23475569%22%20font-family%3D%22sans-serif%22%3E画像を選択してください%3C%2Ftext%3E%3C%2Fsvg%3E";
      artFrame.style.backgroundImage = `url("${defaultImg}")`;
      fullArtBg.style.backgroundImage = `url("${defaultImg}")`;

      const bindText = (inputId, dispId) => {
        document.getElementById(inputId).addEventListener('input', (e) => {
          document.getElementById(dispId).textContent = e.target.value;
        });
      };

      bindText('input-stage', 'disp-stage');
      bindText('input-name', 'disp-name');
      bindText('input-hp', 'disp-hp');
      bindText('input-move-name', 'disp-move-name');
      bindText('input-move-damage', 'disp-move-damage');
      bindText('input-move-desc', 'disp-move-desc');
      bindText('input-author', 'disp-author');

      const typeSelect = document.getElementById('input-type');
      const typeIconMap = {
        grass: '草', fire: '炎', water: '水', lightning: '雷',
        psychic: '超', fighting: '闘', darkness: '悪', metal: '鋼', colorless: '無'
      };

      typeSelect.addEventListener('change', (e) => {
        const val = e.target.value;
        card.setAttribute('data-type', val);
        document.getElementById('disp-type-icon').textContent = typeIconMap[val];
      });

      const raritySelect = document.getElementById('input-rarity');
      const raritySymbolMap = {
        normal: '◇◇',
        ar: '☆',
        sr: '☆☆',
        ur: '☆☆☆',
        crown: '👑'
      };

      raritySelect.addEventListener('change', (e) => {
        const val = e.target.value;
        card.classList.remove('rarity-normal', 'rarity-ar', 'rarity-sr', 'rarity-ur', 'rarity-crown');
        card.classList.add(`rarity-${val}`);
        document.getElementById('disp-rarity').textContent = raritySymbolMap[val];
      });

      document.getElementById('input-image').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const imgData = event.target.result;
            artFrame.style.backgroundImage = `url("${imgData}")`;
            fullArtBg.style.backgroundImage = `url("${imgData}")`;
          };
          reader.readAsDataURL(file);
        }
      });

      const wrapper = document.querySelector('.preview-wrapper');
      let isExporting = false;

      wrapper.addEventListener('mousemove', (e) => {
        if (isExporting) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        card.style.transform = `rotateY(${x / 12}deg) rotateX(${-y / 12}deg)`;
      });

      wrapper.addEventListener('mouseleave', () => {
        if (isExporting) return;
        card.style.transform = 'rotateY(0deg) rotateX(0deg)';
      });

      document.getElementById('btn-download').addEventListener('click', () => {
        const btn = document.getElementById('btn-download');
        btn.disabled = true;
        btn.textContent = 'EXPORTING...';
        isExporting = true;

        card.style.transform = 'none';

        setTimeout(() => {
          html2canvas(card, {
            scale: 3,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            logging: false
          }).then(canvas => {
            const link = document.createElement('a');
            link.download = `tcg-card-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          }).catch(err => {
            alert('エクスポートに失敗しました。');
            console.error(err);
          }).finally(() => {
            btn.disabled = false;
            btn.textContent = 'EXPORT CARD IMAGE';
            isExporting = false;
          });
        }, 150);
      });
    });
  </script>
</body>
</html>
